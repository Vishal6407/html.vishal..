<!DOCTYPE html> <!-- Tells the browser to use HTML5. -->
<html lang="en"> <!-- Starts the page and sets its language to English. -->
<head> <!-- Starts the page settings section. -->
  <meta charset="UTF-8"> <!-- Supports standard text characters. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page fit mobile screens. -->
  <title>About Me</title> <!-- Sets the browser tab title. -->
  <style> /* Starts the CSS styles. */
    body { font-family: Arial, sans-serif; background-color: #d30f9c; margin: 0; padding: 24px; } /* Sets the font, background, and page spacing. */
    main { max-width: 500px; margin: 40px auto; padding: 24px; background-color: rgb(255, 255, 255); border-radius: 12px; } /* Creates a centered white card with rounded corners. */
    h1 { color: #def017; } /* Makes the main heading blue. */
    h2 { color: #0ce43b; } /* Makes the hobbies heading dark gray. */
    p, li { font-size: 18px; line-height: 1.6; } /* Makes paragraph and list text easier to read. */
  </style> <!-- Ends the CSS section. -->
</head> <!-- Ends the page settings section. -->
<body> <!-- Starts the visible page content. -->
  <main> <!-- Groups the main content inside the styled card. -->
    <h1>vishal</h1> <!-- Displays your name as the main heading. -->
    <p>slnce</p> <!-- Displays your college. -->
    <h2>my daily work</h2> <!-- Introduces your hobbies. -->
    <ul> <!-- Starts a bulleted list. -->
      <li>playing</li> <!-- Displays your first hobby. -->
      <li>watching cricket</li> <!-- Displays your second hobby. -->
      <li>sleeping</li> <!-- Displays your third hobby. -->
    </ul> <!-- Ends the hobbies list. -->
  </main> <!-- Ends the main content. -->
  <button type="hari" onclick="alert('HELLO TWILIGHT')">CLICK PANNUNGA</button>
</body> <!-- Ends the visible page content. -->
</html> <!-- Ends the HTML document. -->
